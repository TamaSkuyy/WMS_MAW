x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wms-wma-app:prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # Tambahkan env lain yang dibutuhkan dari .env.prod
    env_file:
      - .env.prod
    volumes:
      - storage-vol:/var/www/html/storage
      # Backup DB (spatie/laravel-backup) → folder host TERPISAH dari storage-vol,
      # supaya backup tetap aman kalau volume utama bermasalah & mudah diakses dari VPS.
      - ./backups/db:/backups:rw
      # Batas PHP (memory_limit dll) — di-mount supaya bisa diubah tanpa rebuild:
      # edit docker/php/zz-wms.ini lalu `docker compose ... up -d`.
      - ./docker/php/zz-wms.ini:/usr/local/etc/php/conf.d/zz-wms.ini:ro
    depends_on:
      - redis
      - mysql
    stop_grace_period: 30s
    healthcheck:
      # -f: healthcheck GAGAL kalau endpoint balas non-2xx (sebelumnya tanpa -f,
      # 404/500 pun dianggap sehat). Endpoint: routes/web.php /health/ping
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      # FrankenPHP/Octane butuh waktu boot setelah restart
      start_period: 60s
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage-vol:/var/www/html/storage
      - ./public:/var/www/html/public
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "nginx"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  queue:
    image: wms-wma-app:prod
    restart: unless-stopped
    # --max-time/--max-jobs: daur ulang worker secara berkala supaya memori
    # tidak menumpuk (penyebab container OOM-kill → 502 saat idle).
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=1800 --max-time=3600 --max-jobs=1000
    env_file:
      - .env.prod
    volumes:
      - storage-vol:/var/www/html/storage
      # Import besar berjalan di sini — ikut memakai batas PHP dari zz-wms.ini.
      - ./docker/php/zz-wms.ini:/usr/local/etc/php/conf.d/zz-wms.ini:ro
    depends_on:
      - redis
      - mysql
    healthcheck:
      test: ["CMD", "pidof", "php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  scheduler:
    image: wms-wma-app:prod
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env.prod
    volumes:
      - storage-vol:/var/www/html/storage
      # WAJIB: `backup:run --only-db` / `backup:clean` / `backup:monitor` dan
      # health check `Backups` dijalankan dari container INI. Tanpa mount ini
      # backup ditulis ke filesystem container scheduler (hilang saat container
      # dibuat ulang) dan check Backups selalu "No backups found".
      - ./backups/db:/backups:rw
      - ./docker/php/zz-wms.ini:/usr/local/etc/php/conf.d/zz-wms.ini:ro
    depends_on:
      - redis
      - mysql
    healthcheck:
      test: ["CMD", "pidof", "php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  reverb:
    image: wms-wma-app:prod
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8081 --no-interaction
    env_file:
      - .env.prod
    volumes:
      - storage-vol:/var/www/html/storage
      - ./docker/php/zz-wms.ini:/usr/local/etc/php/conf.d/zz-wms.ini:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "pidof", "php"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # wait_timeout/interactive_timeout diperbesar: koneksi worker Octane yang
    # menganggur lama tidak langsung diputus MySQL (mengurangi error saat idle).
    command: --max_allowed_packet=512M --wait_timeout=28800 --interactive_timeout=28800
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-vol:/var/lib/mysql
    logging: *default-logging

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-vol:/data
    logging: *default-logging

volumes:
  mysql-vol:
  redis-vol:
  storage-vol:
