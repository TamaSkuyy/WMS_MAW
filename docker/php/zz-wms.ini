; ─────────────────────────────────────────────────────────────────────────────
; Batas runtime PHP untuk WMS MAW (dipakai SEMUA service PHP: app/Octane,
; queue, scheduler, reverb).
;
; File ini di-COPY ke image (Dockerfile) DAN di-bind-mount oleh
; docker-compose.prod.yml ke /usr/local/etc/php/conf.d/zz-wms.ini.
; Karena di-mount, nilai di bawah bisa diubah TANPA rebuild image:
;
;   nano docker/php/zz-wms.ini
;   docker compose -p wms-wma-prod -f docker-compose.prod.yml --env-file .env.prod up -d
;
; Kenapa 512M: default image php 128M → request/job berat (import besar,
; halaman dengan data banyak) membuat worker Octane mati kehabisan memori
; ("Allowed memory size of 134217728 bytes exhausted") dan nginx membalas 502.
; Ingat: ini jaring pengaman, bukan solusi — query yang memuat data tak
; terbatas tetap harus dibatasi (paginate/limit).
memory_limit=512M

; Upload import (controller memvalidasi max:10240 = 10 MB) + ruang overhead.
upload_max_filesize=12M
post_max_size=13M

; Import besar & halaman berat.
max_execution_time=300
max_input_time=300

; Form input header frame banyak baris (default 1000 terlalu kecil).
max_input_vars=5000
