server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Docker internal DNS resolver (127.0.0.11)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Security Headers ──────────────────────────────────────────────
    # CSP + HSTS + XFO + Referrer-Policy dihandle oleh Laravel middleware
    # (app/Http/Middleware/SecurityHeaders.php)
    # Nginx hanya serve static content, tidak set security headers

    charset utf-8;

    # ── Batas ukuran upload ───────────────────────────────────────────
    # Default nginx hanya 1 MB → file import Excel yang lebih besar ditolak
    # sebelum sampai ke Laravel (413/502 di mata operator). Controller
    # memvalidasi max:10240 (10 MB); 12 MB memberi ruang overhead multipart.
    client_max_body_size 12M;
    client_body_timeout 120s;

    # ── Static files ──────────────────────────────────────────────────
    location /build/ {
        alias /var/www/html/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        alias /var/www/html/public/images/;
        expires 30d;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Manual Book (static HTML) ────────────────────────────────────────
    # Serve langsung dari host ./public/docs (bind mount) — selalu up-to-date
    # via git pull, tidak bergantung pada file di image app container.
    # Catatan: /docs tanpa trailing slash tetap diproxy ke app (route Laravel
    # sudah punya guard 404), jadi hanya /docs/... yang di-serve di sini.
    location ^~ /docs/ {
        alias /var/www/html/public/docs/;
        index index.html;
        expires 1h;
    }

    # ── Proxy to FrankenPHP/Octane ────────────────────────────────────
    location / {
        set $backend "app:8080";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        # Jangan paksa "Connection: upgrade" untuk request biasa — itu mematikan
        # keepalive ke Octane dan menyumbang 502 intermiten setelah idle.
        # WebSocket Reverb sudah dilayani location /app terpisah.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Kalau app sempat restart/putus, coba upstream lagi sebelum menyerah 502
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ── WebSocket (Reverb) ────────────────────────────────────────────
    location /app {
        set $reverb_backend "reverb:8081";
        proxy_pass http://$reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Reverb API endpoints (HTTP)
    location /apps {
        set $reverb_backend "reverb:8081";
        proxy_pass http://$reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
