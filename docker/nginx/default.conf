server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Docker internal DNS resolver (127.0.0.11)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Security Headers ──────────────────────────────────────────────
    # CSP + HSTS + XFO + Referrer-Policy dihandle oleh Laravel middleware
    # (app/Http/Middleware/SecurityHeaders.php)
    # Nginx hanya serve static content, tidak set security headers

    charset utf-8;

    # ── Static files ──────────────────────────────────────────────────
    location /build/ {
        alias /var/www/html/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        alias /var/www/html/public/images/;
        expires 30d;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Proxy to FrankenPHP/Octane ────────────────────────────────────
    location / {
        set $backend "app:8080";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── WebSocket (Reverb) ────────────────────────────────────────────
    location /app {
        set $reverb_backend "reverb:8081";
        proxy_pass http://$reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Reverb API endpoints (HTTP)
    location /apps {
        set $reverb_backend "reverb:8081";
        proxy_pass http://$reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
